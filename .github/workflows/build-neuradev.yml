name: Build NeuraDeV (Windows)

on:
  push:
    paths:
      - 'NeuraDeV/**'
      - '.github/workflows/build-neuradev.yml'
  workflow_dispatch:

permissions:
  contents: write   # allow updating the rolling release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        working-directory: NeuraDeV
        run: dotnet restore

      - name: Build (Release)
        working-directory: NeuraDeV
        run: dotnet build src/NeuraDeV -c Release --no-restore

      - name: Publish self-contained single-file exe
        working-directory: NeuraDeV
        run: >
          dotnet publish src/NeuraDeV
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o build

      - name: List build output
        working-directory: NeuraDeV/build
        run: Get-ChildItem -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Package zip
        working-directory: NeuraDeV
        run: Compress-Archive -Path build/* -DestinationPath NeuraDeV-windows-x64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuraDeV-windows-x64
          path: NeuraDeV/NeuraDeV-windows-x64.zip
          retention-days: 30
          if-no-files-found: error

      # Rolling release with stable download URL
      - name: Publish rolling Release "neuradev-latest"
        if: github.ref == 'refs/heads/claude/neuradev-platform-build-Puewy' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neuradev-latest
          name: NeuraDeV — latest build
          body: |
            Automatischer Build des aktuellen Branches.
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          prerelease: true
          files: |
            NeuraDeV/NeuraDeV-windows-x64.zip
            NeuraDeV/build/NeuraDeV.exe
